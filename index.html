<script>
async function go() {
  const button = document.querySelector("button");
  const out = document.getElementById("out");
  const message = document.getElementById("mail").value;
  const style = document.getElementById("style").value;

  if (!message.trim()) {
    out.textContent = "Bitte geben Sie eine Kundennachricht ein.";
    return;
  }

  button.disabled = true;
  button.textContent = "Antwort wird erstellt...";
  out.textContent = "KI erstellt gerade eine Antwort...";

  try {
    const response = await fetch("/api/generate", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: message,
        style: style
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Fehler bei der Anfrage");
    }

    out.textContent = data.answer || "Keine Antwort erhalten.";

  } catch (error) {
    out.textContent =
      "Fehler: " + error.message;
  } finally {
    button.disabled = false;
    button.textContent = "Antwort erstellen";
  }
}
</script>
